# Publica el catálogo para clientes en GitHub Pages (ver catalogo/LEEME.md).
# Corre solo cada media hora, y también cuando la página del celular avisa
# que cambió un producto o cuando se toca "Run workflow" a mano.
name: Catálogo

on:
  schedule:
    - cron: "7,37 * * * *"     # a los 7 y a los 37 de cada hora
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "catalogo/**"
      - "servicios/catalogo.py"
      - ".github/workflows/catalogo.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; si llegan varias seguidas, queda solo la última en espera
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    # Mientras no exista la variable WHATSAPP_NEGOCIO (el último paso de
    # catalogo/LEEME.md), la tarea no hace nada: ni publica ni manda correos de error.
    if: ${{ vars.WHATSAPP_NEGOCIO != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: catalogo/requirements.txt
      - run: pip install -r catalogo/requirements.txt
      - id: pages
        uses: actions/configure-pages@v5
      - name: Generar el catálogo
        run: python -m catalogo.generar --salida sitio
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN_LECTURA: ${{ secrets.TURSO_TOKEN_LECTURA }}
          WHATSAPP_NEGOCIO: ${{ vars.WHATSAPP_NEGOCIO }}
          CATALOGO_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: despliegue
        uses: actions/deploy-pages@v5
