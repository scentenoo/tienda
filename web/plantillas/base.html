<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2c3e50">
<link rel="manifest" href="{{ url_for('manifiesto') }}">
<link rel="icon" href="{{ url_for('static', filename='icono-192.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icono-192.png') }}">
<title>{% block titulo %}Charcutería HYE{% endblock %}</title>
<style>
:root {
  --fondo: #f4f5f7; --tarjeta: #ffffff; --texto: #1f2933; --suave: #6b7580;
  --borde: #e2e5e9; --acento: #2c3e50; --sobre-acento: #ffffff; --chip: #e9ecef;
  --bien: #1e7a46; --bien-fondo: #d4edda; --alerta: #a3242f; --alerta-fondo: #f8d7da;
  --aviso-fondo: #fff3cd; --aviso: #7a5a0c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fondo: #14171a; --tarjeta: #1d2126; --texto: #e6e8ea; --suave: #9aa3ad;
    --borde: #2e343b; --acento: #8fb3d9; --sobre-acento: #14171a; --chip: #2a3036;
    --bien: #7fd3a1; --bien-fondo: #17301f; --alerta: #f19a9f; --alerta-fondo: #43201f;
    --aviso-fondo: #3a3113; --aviso: #f1d27a;
  }
}
* { box-sizing: border-box; }
button, input { font-family: inherit; }
body { margin: 0; background: var(--fondo); color: var(--texto);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
a { color: var(--acento); }
h1 { font-size: 1.35rem; margin: 0 0 2px; }
h2 { font-size: 1.05rem; margin: 22px 0 8px; }
.sub { color: var(--suave); font-size: .88rem; margin: 0 0 14px; }
.volver { display: inline-block; margin-bottom: 10px; text-decoration: none; font-weight: 600; }
.tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; padding: 12px 14px; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi b { display: block; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.kpi span { color: var(--suave); font-size: .82rem; }
.kpi small { display: block; color: var(--suave); font-size: .78rem; margin-top: 2px; }
.menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.menu a { display: flex; flex-direction: column; gap: 4px; padding: 16px 14px; text-decoration: none;
  color: var(--texto); background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; }
.menu a b { font-size: 1.02rem; }
.menu a span { color: var(--suave); font-size: .82rem; }
.lista { list-style: none; margin: 0; padding: 0; background: var(--tarjeta);
  border: 1px solid var(--borde); border-radius: 12px; overflow: hidden; }
.lista > li { border-top: 1px solid var(--borde); }
.lista > li:first-child { border-top: 0; }
.fila { display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 12px 14px; color: inherit; text-decoration: none; }
.fila .izq { min-width: 0; }
.fila .izq b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.fila .izq span { color: var(--suave); font-size: .82rem; }
.fila .der { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.etiqueta { display: inline-block; font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.etiqueta.debe { background: var(--alerta-fondo); color: var(--alerta); }
.etiqueta.fiado { background: var(--aviso-fondo); color: var(--aviso); }
.etiqueta.pagado { background: var(--bien-fondo); color: var(--bien); }
.positivo { color: var(--bien); }
.negativo { color: var(--alerta); }
form.buscar { display: flex; gap: 8px; margin-bottom: 12px; }
input[type=search], input[type=password], input[type=text], input[type=number] {
  width: 100%; font-size: 16px; padding: 11px 14px; border-radius: 10px;
  border: 1px solid var(--borde); background: var(--tarjeta); color: var(--texto); }
.boton { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0;
  border-radius: 10px; padding: 12px 16px; font-size: 1rem; font-weight: 600; cursor: pointer;
  text-decoration: none; background: var(--acento); color: var(--sobre-acento); }
.boton.secundario { background: var(--chip); color: var(--texto); }
.botones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
.error { background: var(--alerta-fondo); color: var(--alerta); padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; }
.vacio { text-align: center; color: var(--suave); padding: 24px; }
details summary { list-style: none; cursor: pointer; }
details summary::-webkit-details-marker { display: none; }
.detalle { padding: 0 14px 12px; color: var(--suave); font-size: .88rem; }
.detalle div { display: flex; justify-content: space-between; gap: 10px; }
.navdia { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 12px; }
.pie { display: flex; justify-content: space-between; align-items: center; margin-top: 28px;
  color: var(--suave); font-size: .82rem; }
.pie button { background: none; border: 0; color: var(--acento); font: inherit; cursor: pointer; padding: 0; }
.campo { display: block; font-size: .88rem; color: var(--suave); margin-top: 12px; }
.campo:first-of-type { margin-top: 0; }
.campo input { margin-top: 4px; color: var(--texto); }
.boton.chico { padding: 8px 12px; font-size: .88rem; margin-top: 8px; }
.boton:disabled { opacity: .6; }
.resumen-abono div { display: flex; justify-content: space-between; padding: 6px 0; font-variant-numeric: tabular-nums; }
.resumen-abono div span { color: var(--suave); }
.resumen-abono .total { border-top: 1px solid var(--borde); margin-top: 4px; padding-top: 10px; font-size: 1.1rem; }
.resumen-abono .aviso-exceso { display: block; background: var(--aviso-fondo); color: var(--aviso); border-radius: 8px; padding: 8px 10px; margin-top: 8px; font-size: .88rem; }
.exito { background: var(--bien-fondo); color: var(--bien); padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; }
</style>
</head>
<body>
<main>
{% block contenido %}{% endblock %}
</main>
</body>
</html>
