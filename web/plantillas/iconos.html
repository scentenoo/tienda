{# Íconos de trazo, 24×24, que toman el color del texto. #}
{% macro icono(nombre, tam=22) -%}
<svg class="icono" width="{{ tam }}" height="{{ tam }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if nombre == 'inicio' -%}
  <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/>
{%- elif nombre == 'vender' -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>
{%- elif nombre == 'clientes' -%}
  <circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.3c2.1.7 3.5 2.8 3.5 5.7"/>
{%- elif nombre == 'ventas' -%}
  <path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>
{%- elif nombre == 'mas' -%}
  <path d="M4 6h16M4 12h16M4 18h16"/>
{%- elif nombre == 'pendientes' -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif nombre == 'caja' -%}
  <rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9.5v5M18 9.5v5"/>
{%- elif nombre == 'inventario' -%}
  <path d="M12 3 3.5 7.5v9L12 21l8.5-4.5v-9z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/>
{%- elif nombre == 'compras' -%}
  <path d="M2.5 6h11v10h-11z"/><path d="M13.5 9.5h4l3 3.5v3h-7"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>
{%- elif nombre == 'gastos' -%}
  <path d="M7 3h10v18H7z"/><path d="M10 7.5h4M10 11.5h4M10 15.5h2"/>
{%- elif nombre == 'perdidas' -%}
  <path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v5M14 11v5"/>
{%- elif nombre == 'audio' -%}
  <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/>
{%- elif nombre == 'salir' -%}
  <path d="M15 4h4v16h-4"/><path d="M10 8l-4 4 4 4M6 12h10"/>
{%- elif nombre == 'flecha' -%}
  <path d="M9 5l7 7-7 7"/>
{%- endif -%}
</svg>
{%- endmacro %}
